<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Invitación</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <!-- Pantalla de acceso -->
  <div class="access-screen" id="accessScreen">
    <div class="access-box">
      <input type="password" id="accessCode" placeholder="Tu nombre secreto 🌺" />
      <button onclick="checkCode()">Entrar</button>
      <p id="errorMessage"></p>
    </div>
  </div>

  <!-- Tarjeta de invitación -->
  <div class="card" id="invitationCard">
    <div class="event-box">
      <p id="welcomeMessage"></p>       
      <img src="images/tarjeta.png" alt="Decoración" class="event-image" />
      <div class="countdown" id="countdown"></div>
      <div class="map-container">
          <a 
          href="https://maps.app.goo.gl/QtsQQmDsZoxVrcDq9"
          target="_blank" 
          class="map-link">
          <h2>📍Salón CoosPu </h2>
        </a>
      </div>          
      <section class="confirmar-container">
        <form id="confirmForm">
          <select id="asistencia" required>
            <option value="">Seleccioná una opción</option>
            <option value="Sí">Sí, asistiré</option>
            <option value="No">No podré asistir</option>
          </select>
          <button type="submit">Confirmar</button>
        </form>
          <div id="mensajeConfirmacion" style="display: none; margin-top: 20px; text-align: center;"> <!-- Mensaje de confirmación -->
            <p>🎉 ¡Te espero para divertirnos!
              <a href="images/tarjeta_catarina.jpg" download>📥 Descargar invitación </a>
              <a href="cumple_catarina.ics"> 📅 Agendar en mi calendario </a>
            </p>
          </div>
      </section>
    </div>
  </div>
  <audio id="musica" src="sound/Hawaiian Roller Coaster Ride (From Lilo & Stitch).mp3" loop></audio>

  <script>
    window.addEventListener('click', function () {
      const musica = document.getElementById('musica');
      musica.play();
    }, { once: true });
  </script>

  <canvas id="confeti"></canvas>

</body>
</html>
